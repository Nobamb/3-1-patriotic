<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼일절 기념 퀴즈</title>
    <style>
        /* 기본 초기화 및 폰트 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
        body { background-color: #f0f0f0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        /* 상단 네비게이션 바 */
        header {
            background-color: #000; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 30px; height: 60px;
            position: relative; z-index: 1000;
        }
        .header-title { font-weight: bold; font-size: 1.2rem; }
        
        /* 햄버거 메뉴 버튼 (데스크탑에서는 숨김) */
        .hamburger-btn {
            display: none; flex-direction: column; justify-content: space-around;
            width: 30px; height: 24px; background: transparent; border: none; cursor: pointer;
        }
        .hamburger-btn span {
            display: block; width: 100%; height: 3px; background-color: #fff; border-radius: 2px;
        }

        /* 컨트롤 영역 (데스크탑: 헤더 우측 / 모바일&태블릿: 슬라이드 메뉴) */
        .controls-container {
            display: flex; align-items: center; gap: 15px;
        }
        
        .search-title-mobile { display: none; } /* 모바일용 메뉴 타이틀 */

        .search-container { display: flex; gap: 10px; align-items: center; }
        .search-container input {
            padding: 8px 15px; border-radius: 20px; border: none; outline: none; width: 300px; font-size: 0.9rem;
        }
        .btn-google, .btn-namu {
            padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem;
            white-space: nowrap;
        }
        .btn-google { background-color: #fff; color: #000; }
        .btn-namu { background-color: #00a651; color: #fff; }
        
        .music-btn {
            background-color: #fff; border: none; border-radius: 50%;
            width: 35px; height: 35px; cursor: pointer; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
        }

        /* 메인 컨텐츠 영역 */
        main { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }

        /* 태극기 느낌의 외부 카드 */
        .card-outer {
            width: 100%; max-width: 800px; min-height: 600px;
            background: linear-gradient(to bottom, #cd313a 0%, #cd313a 20%, #0047a0 80%, #0047a0 100%);
            border-radius: 40px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
        }

        /* 실제 내용이 들어가는 내부 카드 */
        .card-inner {
            background: linear-gradient(to bottom, #ffe6e6, #e6eaff);
            border-radius: 30px; width: 100%; height: 100%; flex-grow: 1;
            padding: 40px; display: flex; flex-direction: column; position: relative;
        }

        /* 퀴즈 영역 */
        .quiz-item { margin-bottom: 25px; }
        .quiz-question { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #333; word-break: keep-all; }
        .quiz-options { display: flex; gap: 15px; font-size: 0.9rem; flex-wrap: wrap; }
        .quiz-options label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* 결과 화면 영역 */
        #resultContainer {
            display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center;
        }
        #resultContainer h1 { font-size: 2.5rem; margin-bottom: 15px; }
        #resultContainer p { font-size: 1.2rem; margin-bottom: 30px; line-height: 1.5; }

        /* 하단 이전/다음 버튼 영역 */
        .nav-buttons {
            display: flex; justify-content: space-between; margin-top: auto; padding-top: 20px;
        }
        .nav-btn {
            background-color: #000; color: #fff; border: none; border-radius: 20px;
            padding: 8px 30px; font-size: 1rem; cursor: pointer;
        }
        .nav-btn:hover { background-color: #333; }
        .right-align { margin-left: auto; }

        /* 푸터 */
        footer {
            background-color: #000; color: #aaa; text-align: center; padding: 10px; font-size: 0.8rem; z-index: 10;
        }

        /* ========================================================
           반응형 디자인 (태블릿 & 모바일 환경: 화면 너비 850px 이하)
           ======================================================== */
        @media (max-width: 850px) {
            header { padding: 10px 20px; }
            .hamburger-btn { display: flex; } /* 햄버거 메뉴 보이기 */

            /* 메뉴 컨테이너를 우측에서 슬라이드되는 오버레이로 변경 */
            .controls-container {
                position: fixed;
                top: 60px; /* 헤더 바로 아래부터 시작 */
                right: -100%; /* 기본적으로 화면 우측 밖으로 숨김 */
                width: 100%;
                height: calc(100vh - 60px);
                background-color: #e0e0e0; /* 기획안의 회색 배경 */
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 1s ease; /* 1초 동안 부드럽게 이동하는 애니메이션 */
                z-index: 999;
                padding: 20px;
            }

            /* 햄버거 메뉴 클릭 시 .active 클래스가 붙어 화면 안으로 들어옴 */
            .controls-container.active { right: 0; }

            /* 슬라이드 메뉴 내부 요소 스타일 조정 */
            .search-title-mobile {
                display: block; font-size: 2rem; font-weight: bold; color: #000; margin-bottom: 30px;
            }
            .music-btn { position: absolute; top: 30px; right: 30px; } /* 음악 버튼은 우측 상단 배치 */
            
            .search-container { flex-direction: column; width: 100%; max-width: 400px; gap: 15px; }
            .search-container input { width: 100%; padding: 12px 15px; }
            
            /* 검색 버튼들을 한 줄에 나란히 배치 */
            .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; }

            /* 카드 크기 및 여백 모바일화 */
            main { padding: 20px 15px; }
            .card-outer { padding: 10px; border-radius: 20px; }
            .card-inner { padding: 20px 15px; border-radius: 15px; }
            .quiz-question { font-size: 1rem; }
            .quiz-options { flex-direction: column; gap: 10px; } /* 보기 항목 세로 배치 */
            #resultContainer h1 { font-size: 1.8rem; }
            #resultContainer p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">삼일절 웹사이트</div>
        
        <button id="hamburgerBtn" class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>

        <div id="controlsContainer" class="controls-container">
            <button id="btnMusic" class="music-btn">🔈</button>
            <div class="search-title-mobile">검색창</div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="검색어 입력 (엔터 시 구글검색)">
                <div class="btn-group">
                    <button id="btnGoogle" class="btn-google">구글 검색</button>
                    <button id="btnNamu" class="btn-namu">나무위키 검색</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="card-outer">
            <div class="card-inner">
                <div id="quizContainer"></div>
                <div id="navContainer" class="nav-buttons">
                    <button id="btnPrev" class="nav-btn" style="display:none;">이전</button>
                    <button id="btnNext" class="nav-btn right-align">다음</button>
                </div>
                <div id="resultContainer">
                    <h1 id="resultTitle"></h1>
                    <p id="resultDesc"></p>
                    <button id="btnRestart" class="nav-btn">다시하기</button>
                </div>
            </div>
        </div>
    </main>

    <footer>배경음악 음원 출처: 행정안전부</footer>
    <audio id="bgAudio" src="music/national-anthem.mp3" loop></audio>

    <script>
        // --- 퀴즈 데이터 ---
        const quizData = [
            { id: 1, q: "3.1 운동이 일어난 연도는 언제일까요?", o: ["1910년", "1919년", "1945년", "1950년"], a: 1 },
            { id: 2, q: "3.1 운동 당시 독립선언서에 서명한 민족 대표는 모두 몇 명이었을까요?", o: ["10인", "24인", "33인", "48인"], a: 2 },
            { id: 3, q: "민족 대표 33인이 모여 기미독립선언서를 낭독한 실제 장소는 어디일까요?", o: ["탑골공원", "태화관", "경복궁", "덕수궁"], a: 1 },
            { id: 4, q: "유관순 열사가 주도하여 만세 운동이 크게 일어난 천안의 장터 이름은 무엇일까요?", o: ["모란장터", "화개장터", "아우내 장터", "동대문 장터"], a: 2 },
            { id: 5, q: "3.1 운동의 배경이 된 사상으로, '각 민족은 스스로의 운명을 결정할 권리가 있다'는 원칙은?", o: ["민족 자결주의", "사회 진화론", "계몽주의", "팬아시아주의"], a: 0 },
            { id: 6, q: "3.1 운동을 계기로, 체계적인 독립운동을 위해 중국 상하이에 수립된 조직은 무엇일까요?", o: ["조선어학회", "신민회", "대한민국 임시정부", "의열단"], a: 2 },
            { id: 7, q: "독립선언서를 기초(작성)한 대표적인 인물은 누구일까요?", o: ["최남선", "안창호", "김구", "윤봉길"], a: 0 },
            { id: 8, q: "3.1 운동 직전인 1919년 2월 8일, 일본 도쿄에서 한국 유학생들이 중심이 되어 발표한 것은?", o: ["광주 학생 항일 운동", "2.8 독립 선언", "6.10 만세 운동", "헤이그 특사"], a: 1 },
            { id: 9, q: "3.1 운동 당시, 일제가 만세 운동에 참여한 마을 주민들을 교회에 가두고 불태운 참변은?", o: ["관동 대지진", "간도 참변", "제암리 학살 사건", "자유시 참변"], a: 2 },
            { id: 10, q: "대한민국 헌법 전문에 명시된 '3.1운동으로 건립된 대한민국 ( )의 법통'의 빈칸은?", o: ["제헌국회", "임시정부", "독립군", "광복군"], a: 1 },
            { id: 11, q: "3.1 운동의 주요 원인 중 하나로, 당시 일제에 의해 독살당했다는 소문이 퍼졌던 조선의 국왕은?", o: ["철종", "고종", "순종", "정조"], a: 1 },
            { id: 12, q: "3.1 운동은 기본적으로 어떤 방식의 저항 운동이었을까요?", o: ["무장 투쟁", "비폭력 평화 시위", "경제 보복", "외교적 협상"], a: 1 },
            { id: 13, q: "민족 대표 33인에 포함되지 않은 종교계는 어디일까요?", o: ["천도교", "기독교", "불교", "천주교"], a: 3 },
            { id: 14, q: "제암리 학살 사건 등을 직접 취재하여 3.1 운동의 참상을 전 세계에 알린 캐나다인 선교사는?", o: ["호머 헐버트", "프랭크 스코필드", "어니스트 베델", "호러스 알렌"], a: 1 },
            { id: 15, q: "민족 대표 33인은 태화관에서 독립선언서를 낭독한 직후 어떤 행동을 취했을까요?", o: ["해외로 망명했다", "탑골공원으로 합류", "스스로 자수했다", "무장 투쟁 시작"], a: 2 },
            { id: 16, q: "3.1 운동에 깜짝 놀란 일제가 이후 '무단 통치'에서 유화적인 모습으로 바꾼 통치 방식은?", o: ["민족 말살 통치", "문화 통치", "신탁 통치", "위임 통치"], a: 1 },
            { id: 17, q: "민족 대표 33인 중 천도교의 대표격으로 3.1 운동을 이끌었던 인물은?", o: ["손병희", "안중근", "김좌진", "이봉창"], a: 0 },
            { id: 18, q: "한용운이 독립선언서 끝에 추가한, 평화적 행동을 강조한 강령은?", o: ["조선책략", "공약 3장", "건국강령", "신민회 규칙"], a: 1 },
            { id: 19, q: "유관순 열사가 서대문형무소에서 순국한 나이는?", o: ["16세", "18세", "21세", "25세"], a: 1 },
            { id: 20, q: "삼일절에 태극기를 게양하는 올바른 방법은?", o: ["깃봉과 깃면을 떼지 않고 단다", "깃면의 너비만큼 내려서 단다", "창문 밖에 아무렇게나 건다", "밤에만 게양한다"], a: 0 }
        ];

        let currentPage = 0;
        const itemsPerPage = 5;
        let userAnswers = new Array(20).fill(null);

        const quizContainer = document.getElementById('quizContainer');
        const navContainer = document.getElementById('navContainer');
        const resultContainer = document.getElementById('resultContainer');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');

        // --- 햄버거 메뉴 로직 ---
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const controlsContainer = document.getElementById('controlsContainer');

        hamburgerBtn.addEventListener('click', () => {
            controlsContainer.classList.toggle('active');
        });

        // --- 퀴즈 및 기타 로직 (이전과 동일) ---
        function renderQuiz() {
            quizContainer.innerHTML = '';
            const startIdx = currentPage * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const currentQuestions = quizData.slice(startIdx, endIdx);

            currentQuestions.forEach((item, index) => {
                const globalIndex = startIdx + index;
                const div = document.createElement('div');
                div.className = 'quiz-item';
                
                const qTitle = document.createElement('div');
                qTitle.className = 'quiz-question';
                qTitle.innerText = `${item.id}. ${item.q}`;
                div.appendChild(qTitle);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'quiz-options';
                item.o.forEach((optText, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q_${globalIndex}`;
                    radio.value = optIndex;
                    
                    if (userAnswers[globalIndex] === optIndex) radio.checked = true;

                    radio.addEventListener('change', () => {
                        userAnswers[globalIndex] = parseInt(radio.value);
                    });

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(`${optIndex + 1}. ${optText}`));
                    optionsDiv.appendChild(label);
                });
                div.appendChild(optionsDiv);
                quizContainer.appendChild(div);
            });

            btnPrev.style.display = currentPage === 0 ? 'none' : 'block';
            btnNext.innerText = currentPage === 3 ? '결과 확인' : '다음';
            
            if(currentPage === 0) btnNext.classList.add('right-align');
            else btnNext.classList.remove('right-align');
        }

        btnPrev.addEventListener('click', () => {
            if (currentPage > 0) { currentPage--; renderQuiz(); }
        });

        btnNext.addEventListener('click', () => {
            const startIdx = currentPage * itemsPerPage;
            for (let i = startIdx; i < startIdx + itemsPerPage; i++) {
                if (userAnswers[i] === null) { alert("모든 문제를 풀어주세요!"); return; }
            }

            if (currentPage < 3) { currentPage++; renderQuiz(); } 
            else { showResult(); }
        });

        function showResult() {
            quizContainer.style.display = 'none';
            navContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            let score = 0;
            userAnswers.forEach((ans, index) => { if (ans === quizData[index].a) score++; });

            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');

            if (score >= 16) {
                resultTitle.innerText = "축하합니다!";
                resultTitle.style.color = "#0047a0";
                resultDesc.innerText = `총 20문제 중 ${score}문제를 맞추셨습니다.\n당신은 진정한 애국자입니다!`;
            } else {
                resultTitle.innerText = "아쉽습니다!";
                resultTitle.style.color = "#cd313a";
                resultDesc.innerText = `총 20문제 중 ${score}문제를 맞추셨습니다.\n다시 해보시겠습니까?`;
            }
        }

        document.getElementById('btnRestart').addEventListener('click', () => {
            userAnswers.fill(null); currentPage = 0;
            resultContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            navContainer.style.display = 'flex';
            renderQuiz();
        });

        const searchInput = document.getElementById('searchInput');
        function doSearch(type) {
            const query = searchInput.value.trim();
            if (!query) { alert("검색어를 입력해주세요."); return; }
            if (type === 'google') window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            else if (type === 'namu') window.open(`https://namu.wiki/Search?q=${encodeURIComponent(query)}`, '_blank');
        }

        document.getElementById('btnGoogle').addEventListener('click', () => doSearch('google'));
        document.getElementById('btnNamu').addEventListener('click', () => doSearch('namu'));
        
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch('google');
        });

        const bgAudio = document.getElementById('bgAudio');
        const btnMusic = document.getElementById('btnMusic');
        let isPlaying = false;

        btnMusic.addEventListener('click', () => {
            if (isPlaying) { bgAudio.pause(); btnMusic.innerText = '🔈'; } 
            else { bgAudio.play(); btnMusic.innerText = '🔊'; }
            isPlaying = !isPlaying;
        });

        renderQuiz();
    </script>
</body>
</html>
